# Q-Crop behind nginx. The app is static files (`npm run build` -> dist/);
# every page is analyzed and cropped in the user's browser. The only thing
# the server receives is the edit log, which nginx hands to the log server
# (server/log-server.mjs, see qcrop-logs.service).
#
# Copy dist/ to /var/www/qcrop/dist, put this in /etc/nginx/sites-available/
# (or conf.d/), set server_name and the certificate paths, and reload nginx.

server {
    listen 80;
    server_name qcrop.example.com;
    # HTTPS is needed for the screen to stay on during analysis (wake lock).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qcrop.example.com;

    ssl_certificate     /etc/letsencrypt/live/qcrop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qcrop.example.com/privkey.pem;

    root /var/www/qcrop/dist;
    index index.html;

    # pdf.js's worker is an .mjs file; browsers only run it as JavaScript.
    include mime.types;
    types { application/javascript mjs; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build files have content hashes in their names: cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Edit log -> log server on this machine.
    location = /__qcrop/log {
        limit_except POST { deny all; }
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types application/javascript text/css application/json;
}
